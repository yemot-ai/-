name: Build FaceLock Pro Android APK
on:
  push:
    branches: ["facelock-studio"]
    paths: ["facelock/**", ".github/workflows/build-facelock.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    name: Build and verify FaceLock Pro APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build debug APK
        run: gradle --no-daemon --stacktrace -p facelock assembleDebug
      - name: Verify APK package
        run: |
          APK="facelock/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -t "$APK" | tail -n 1
          unzip -l "$APK" | grep -q "classes.dex"
          unzip -l "$APK" | grep -q "AndroidManifest.xml"
          ls -lh "$APK"
      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: FACELOCK-PRO-Android-APK
          path: facelock/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: Upload browser visual preview
        uses: actions/upload-artifact@v4
        with:
          name: FACELOCK-PRO-Browser-Preview
          path: facelock/preview.html
          if-no-files-found: error
          retention-days: 30
