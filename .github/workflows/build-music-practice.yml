name: Build לימוד ותרגול למוזיקאים APK

on:
  push:
    branches: [main]
    paths:
      - 'music-practice/**'
      - '.github/workflows/build-music-practice.yml'
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build and verify music practice app
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Check embedded JavaScript syntax
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const html = fs.readFileSync('music-practice/index.html', 'utf8');
          for (const marker of ['id="v-home"', 'id="v-ear"', 'id="v-rhythm"', 'id="v-practice"', 'id="v-dictionary"', 'id="v-tuner"']) {
            if (!html.includes(marker)) throw new Error('Missing required app screen: ' + marker);
          }
          const blocks = [...html.matchAll(/<script>([\s\S]*?)<\/script>/g)];
          if (blocks.length !== 1) throw new Error('Expected one inline JavaScript block');
          fs.writeFileSync('/tmp/music-practice.js', blocks[0][1]);
          NODE
          node --check /tmp/music-practice.js
      - name: Verify Android sources and package offline assets
        run: |
          test -s music-practice/app/src/main/java/com/yemotai/musicpractice/MainActivity.kt
          test -s music-practice/app/src/main/AndroidManifest.xml
          test -s music-practice/app/src/main/res/drawable/ic_music_practice.xml
          mkdir -p music-practice/app/src/main/assets
          cp music-practice/index.html music-practice/app/src/main/assets/index.html
          test -s music-practice/app/src/main/assets/index.html
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle --no-daemon --stacktrace -p music-practice assembleDebug
      - name: Verify installable APK
        run: |
          APK='music-practice/app/build/outputs/apk/debug/app-debug.apk'
          test -s "$APK"
          unzip -t "$APK" | tail -n 1
          unzip -l "$APK" | grep -q 'assets/index.html'
          SIGNER="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools" -type f -name apksigner 2>/dev/null | sort | tail -n 1)"
          if [ -n "$SIGNER" ]; then "$SIGNER" verify --verbose "$APK"; fi
          ls -lh "$APK"
      - name: Upload installable Android APK
        uses: actions/upload-artifact@v4
        with:
          name: Limud-VeTirgul-Muzikayim-APK
          path: music-practice/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: Upload Chrome preview HTML
        uses: actions/upload-artifact@v4
        with:
          name: Limud-VeTirgul-Muzikayim-Chrome-Preview
          path: music-practice/index.html
          if-no-files-found: error
          retention-days: 30