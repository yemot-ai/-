name: Build Poster Studio Offline Android APK

on:
  push:
    branches: ["main"]
    paths:
      - "poster-studio/**"
      - ".github/workflows/build-poster-studio.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and verify Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Verify standalone JavaScript
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const html = fs.readFileSync('poster-studio/index.html', 'utf8');
          const lower = html.toLowerCase();
          const open = lower.indexOf('<script>');
          const close = lower.indexOf('</script>', open);
          if (open < 0 || close < 0) throw new Error('Inline app script was not found');
          fs.writeFileSync('/tmp/poster-studio.js', html.slice(open + 8, close));
          NODE
          node --check /tmp/poster-studio.js
          test -s poster-studio/android/app/src/main/java/com/yemotai/posterstudio/MainActivity.java
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build debug APK
        run: gradle --no-daemon --stacktrace -p poster-studio/android assembleDebug
      - name: Verify APK
        run: |
          APK="poster-studio/android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -t "$APK" | tail -n 1
          unzip -l "$APK" | grep -q "assets/index.html"
          ls -lh "$APK"
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: POSTER-STUDIO-Android-APK
          path: poster-studio/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: Upload browser preview
        uses: actions/upload-artifact@v4
        with:
          name: POSTER-STUDIO-Browser-HTML
          path: poster-studio/index.html
          if-no-files-found: error
          retention-days: 30
