name: Build Voice Studio Offline Android APK

on:
  push:
    branches: ["main"]
    paths:
      - "voice-studio/**"
      - ".github/workflows/build-voice-studio.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and verify Voice Studio APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Verify standalone app script
        run: |
          node - <<'NODE'
          const fs=require('node:fs');
          const html=fs.readFileSync('voice-studio/index.html','utf8');
          const low=html.toLowerCase(), a=low.indexOf('<script>'), b=low.indexOf('</script>',a);
          if(a<0||b<0) throw new Error('Inline app script not found');
          fs.writeFileSync('/tmp/voice-studio.js',html.slice(a+8,b));
          NODE
          node --check /tmp/voice-studio.js
          test -s voice-studio/android/app/src/main/java/com/yemotai/voicestudio/MainActivity.java
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build debug APK
        run: gradle --no-daemon --stacktrace -p voice-studio/android assembleDebug
      - name: Verify APK and bundled offline app
        run: |
          APK="voice-studio/android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -t "$APK" | tail -n 1
          unzip -l "$APK" | grep -q "assets/index.html"
          unzip -l "$APK" | grep -q "AndroidManifest.xml"
          ls -lh "$APK"
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: VOICE-STUDIO-Android-APK
          path: voice-studio/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: Upload browser preview
        uses: actions/upload-artifact@v4
        with:
          name: VOICE-STUDIO-Browser-HTML
          path: voice-studio/index.html
          if-no-files-found: error
          retention-days: 30
