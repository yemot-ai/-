name: Build CUTLAB Studio Ultra Android APK

on:
  push:
    branches: ["main"]
    paths:
      - 'index.html'
      - 'app.css'
      - 'app.js'
      - 'app/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/build-android.yml'
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build and verify Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Verify editor JavaScript
        run: node --check app.js
      - name: Verify editor source files
        run: |
          test -s index.html
          test -s app.css
          test -s app.js
          test -s app/src/main/java/com/yemotai/videostudio/MainActivity.kt
          grep -q '<script' index.html
          grep -q '<style' index.html
      - name: Package standalone editor into Android assets
        run: |
          mkdir -p app/src/main/assets
          cp index.html app/src/main/assets/index.html
          test -s app/src/main/assets/index.html
      - name: Verify standalone browser script
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const html = fs.readFileSync('index.html', 'utf8');
          const lower = html.toLowerCase();
          const scriptOpen = lower.indexOf('<script>');
          const scriptClose = lower.indexOf('</script>', scriptOpen);
          const bodyOpen = lower.indexOf('<body');
          const bodyClose = lower.lastIndexOf('</body>');
          const canvasOpen = lower.indexOf('id="previewcanvas"');
          if (scriptOpen < 0 || scriptClose < 0 || lower.indexOf('<script', scriptOpen + 1) >= 0) {
            throw new Error('Expected exactly one inline editor script');
          }
          if (bodyOpen < 0 || bodyClose < 0 || canvasOpen < bodyOpen || scriptOpen < canvasOpen || scriptOpen > bodyClose) {
            throw new Error('Editor script must execute after the preview canvas is present in the document');
          }
          fs.writeFileSync('/tmp/cutlab-inline-check.js', html.slice(scriptOpen + 8, scriptClose));
          NODE
          node --check /tmp/cutlab-inline-check.js
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build debug APK
        run: gradle --no-daemon --stacktrace assembleDebug
      - name: Verify APK
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -t "$APK" | tail -n 1
          unzip -l "$APK" | grep -q 'assets/index.html'
          SIGNER="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools" -type f -name apksigner 2>/dev/null | sort | tail -n 1)"
          if [ -n "$SIGNER" ]; then "$SIGNER" verify --verbose "$APK"; fi
          ls -lh "$APK"
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: CUTLAB-STUDIO-ULTRA-Android-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
