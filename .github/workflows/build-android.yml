name: Build Android APK

on:
  push:
    branches: ["main"]
    paths:
      - 'CUTLAB_STUDIO_SOURCE.zip.b64'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Restore source bundle
        run: |
          base64 --decode CUTLAB_STUDIO_SOURCE.zip.b64 > CUTLAB_STUDIO_SOURCE.zip
          unzip -o CUTLAB_STUDIO_SOURCE.zip -d .
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build debug APK
        run: gradle --no-daemon --stacktrace assembleDebug
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: CUTLAB-Android-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
