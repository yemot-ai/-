name: Build Android APK

on:
  push:
    branches: ["main"]
    paths:
      - '.source_parts/**'
      - '.github/workflows/build-android.yml'
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Restore source bundle
        run: |
          cat .source_parts/part-*.b64 | tr -d '\n\r ' > /tmp/cutlab-source.b64
          test "$(wc -c < /tmp/cutlab-source.b64)" -gt 10000
          base64 --decode /tmp/cutlab-source.b64 > /tmp/CUTLAB_STUDIO_SOURCE.zip
          unzip -t /tmp/CUTLAB_STUDIO_SOURCE.zip
          unzip -o /tmp/CUTLAB_STUDIO_SOURCE.zip -d . -x '.github/*'
          test -s index.html
          test -s app.js
          test -s android/app/src/main/java/com/yby/cutlab/MainActivity.kt
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build debug APK
        working-directory: android
        run: gradle --no-daemon --stacktrace assembleDebug
      - name: Verify APK
        run: |
          test -s android/app/build/outputs/apk/debug/app-debug.apk
          ls -lh android/app/build/outputs/apk/debug/app-debug.apk
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: CUTLAB-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
