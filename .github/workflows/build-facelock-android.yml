name: Build FaceLock Android APK

on:
  push:
    branches: ["main"]
    paths:
      - "facelock-android/**"
      - ".github/workflows/build-facelock-android.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct and validate Android source archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/facelock-unpack
          {
            head -c 5500 facelock-android/source-parts-v5/part01.b64
            cat facelock-android/source-parts-v5/part02.b64
            cat facelock-android/source-parts-v5/part03a.b64
            cat facelock-android/source-parts-v5/part03b.b64
            cat facelock-android/source-parts-v6/part04.b64
            cat facelock-android/source-parts-v6/part05.b64
            cat facelock-android/source-parts-v6/part06.b64
            cat facelock-android/source-parts-v6/part07.b64
            cat facelock-android/source-parts-v6/part08a.b64
            cat facelock-android/source-parts-v6/part08b.b64
          } | tr -d '\r\n ' | base64 --decode > /tmp/FaceLockAndroidProject.zip
          unzip -t /tmp/FaceLockAndroidProject.zip
          python3 - <<'PY'
          import pathlib, zipfile
          p = pathlib.Path("/tmp/FaceLockAndroidProject.zip")
          with zipfile.ZipFile(p) as z:
              names = set(z.namelist())
              required = {
                  "settings.gradle.kts", "build.gradle.kts", "app/build.gradle.kts",
                  "app/src/main/AndroidManifest.xml",
                  "app/src/main/java/com/yemotai/facelock/MainActivity.kt",
                  "app/src/main/java/com/yemotai/facelock/FaceCaptureActivity.kt",
              }
              missing = required - names
              if missing:
                  raise SystemExit("Missing required source files: " + ", ".join(sorted(missing)))
              if z.testzip() is not None:
                  raise SystemExit("ZIP CRC validation failed")
              print(f"Validated FaceLock source ZIP: {p.stat().st_size} bytes, {len(names)} files")
          PY
          unzip -q /tmp/FaceLockAndroidProject.zip -d /tmp/facelock-unpack
          # Repair small Android source compatibility issues before compilation.
          find /tmp/facelock-unpack -type f -name '*.xml' -exec sed -i 's/android:hintTextColor/android:textColorHint/g' {} +
          python3 - <<'PY'
          from pathlib import Path
          root = Path("/tmp/facelock-unpack")
          service = root / "app/src/main/java/com/yemotai/facelock/AppMonitorService.kt"
          source = service.read_text()
          if "import android.widget.Button" not in source:
              source = source.replace(
                  "package com.yemotai.facelock",
                  "package com.yemotai.facelock\\n\\nimport android.widget.Button",
                  1,
              )
          service.write_text(source)

          main = root / "app/src/main/java/com/yemotai/facelock/MainActivity.kt"
          source = main.read_text()
          source = source.replace(
              "val text = label(profile.name, 14, 0xFFF3F8FF.toInt())",
              "val profileLabel = label(profile.name, 14, 0xFFF3F8FF.toInt())",
          )
          source = source.replace(
              "row.addView(text, LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.WRAP_CONTENT, 1f))",
              "row.addView(profileLabel, LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.WRAP_CONTENT, 1f))",
          )
          main.write_text(source)
          PY
          cp -a /tmp/facelock-unpack/. facelock-android/

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Download and bundle offline face model
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p facelock-android/app/src/main/assets /tmp/face-model
          curl --fail --location --retry 3 \
            https://pub.dev/api/archives/face_detection_tflite-6.10.1.tar.gz \
            --output /tmp/face_detection_tflite.tar.gz
          tar -xzf /tmp/face_detection_tflite.tar.gz -C /tmp/face-model
          MODEL="$(find /tmp/face-model -type f -iname 'mobilefacenet.tflite' -print -quit)"
          if [ -z "$MODEL" ]; then
            echo "MobileFaceNet model not found in package archive." >&2
            find /tmp/face-model -type f | head -100
            exit 1
          fi
          cp "$MODEL" facelock-android/app/src/main/assets/mobilefacenet.tflite
          test -s facelock-android/app/src/main/assets/mobilefacenet.tflite

      - name: Build and validate APK
        working-directory: facelock-android
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace assembleDebug
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -t "$APK" | tail -n 1
          unzip -l "$APK" | grep -q 'assets/mobilefacenet.tflite'
          ls -lh "$APK"

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: FACELOCK-ANDROID-APK
          path: facelock-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload Chrome preview
        uses: actions/upload-artifact@v4
        with:
          name: FACELOCK-CHROME-PREVIEW
          path: facelock-android/preview/index.html
          if-no-files-found: error
          retention-days: 30

      - name: Upload Android source project
        uses: actions/upload-artifact@v4
        with:
          name: FACELOCK-SOURCE-PROJECT
          path: facelock-android/
          if-no-files-found: error
          retention-days: 30
