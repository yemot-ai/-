name: Build FaceLock Android APK

on:
  push:
    branches: ["main"]
    paths:
      - "facelock-android/**"
      - ".github/workflows/build-facelock-android.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct Android source archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/facelock-unpack
          python3 - <<'PY'
          import base64, io, pathlib, struct, zipfile
          encoded = pathlib.Path("facelock-android/source-parts/part01.b64").read_text().strip()
          raw = base64.b64decode(encoded)
          candidates = []
          start = 0
          while True:
              pos = raw.find(b"PK\x05\x06", start)
              if pos < 0:
                  break
              if pos + 22 <= len(raw):
                  comment_len = struct.unpack_from("<H", raw, pos + 20)[0]
                  end = pos + 22 + comment_len
                  if end <= len(raw):
                      candidates.append(raw[:end])
              start = pos + 4
          for candidate in reversed(candidates):
              try:
                  with zipfile.ZipFile(io.BytesIO(candidate)) as archive:
                      names = set(archive.namelist())
                      required = {"settings.gradle.kts", "build.gradle.kts", "app/build.gradle.kts",
                                  "app/src/main/AndroidManifest.xml",
                                  "app/src/main/java/com/yemotai/facelock/MainActivity.kt"}
                      if required.issubset(names) and archive.testzip() is None:
                          pathlib.Path("/tmp/FaceLockAndroidProject.zip").write_bytes(candidate)
                          print("Validated Android source archive:", len(candidate), "bytes")
                          break
              except Exception:
                  pass
          else:
              raise SystemExit("The source archive did not validate. The FaceLock source bundle needs repair.")
          PY
          unzip -q /tmp/FaceLockAndroidProject.zip -d /tmp/facelock-unpack
          cp -a /tmp/facelock-unpack/. facelock-android/

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Download bundled offline face model
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p facelock-android/app/src/main/assets /tmp/face-model
          curl --fail --location --retry 3 \
            https://pub.dev/api/archives/face_detection_tflite-6.10.1.tar.gz \
            --output /tmp/face_detection_tflite.tar.gz
          tar -xzf /tmp/face_detection_tflite.tar.gz -C /tmp/face-model
          MODEL="$(find /tmp/face-model -type f -iname 'mobilefacenet.tflite' -print -quit)"
          if [ -z "$MODEL" ]; then
            echo "MobileFaceNet model not found in package archive." >&2
            find /tmp/face-model -type f -iname '*.tflite' | head -80
            exit 1
          fi
          cp "$MODEL" facelock-android/app/src/main/assets/mobilefacenet.tflite
          test -s facelock-android/app/src/main/assets/mobilefacenet.tflite

      - name: Build APK
        working-directory: facelock-android
        run: |
          gradle --no-daemon --stacktrace assembleDebug
          test -s app/build/outputs/apk/debug/app-debug.apk
          unzip -t app/build/outputs/apk/debug/app-debug.apk | tail -n 1
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -q 'assets/mobilefacenet.tflite'

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: FACELOCK-ANDROID-APK
          path: facelock-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload Chrome preview
        uses: actions/upload-artifact@v4
        with:
          name: FACELOCK-CHROME-PREVIEW
          path: facelock-android/preview/index.html
          if-no-files-found: error
          retention-days: 30

      - name: Upload unpacked source project
        uses: actions/upload-artifact@v4
        with:
          name: FACELOCK-SOURCE-PROJECT
          path: facelock-android/
          if-no-files-found: error
          retention-days: 30
