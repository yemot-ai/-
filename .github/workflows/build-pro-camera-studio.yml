name: Build PRO CAMERA STUDIO APK

on:
  push:
    branches:
      - build/pro-camera-studio
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct Android project
        shell: bash
        run: |
          cat ProCameraStudio_Source.part0 ProCameraStudio_Source.part1 ProCameraStudio_Source.part2 ProCameraStudio_Source.part3 > source.zip.b64
          base64 --decode source.zip.b64 > source.zip
          unzip -tq source.zip
          unzip -q source.zip
          test -f ProCameraStudio/app/build.gradle.kts
          test -f ProCameraStudio/settings.gradle.kts

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: |
          cd ProCameraStudio
          gradle --no-daemon clean assembleDebug

      - name: Verify APK
        run: |
          test -s ProCameraStudio/app/build/outputs/apk/debug/app-debug.apk
          ls -lh ProCameraStudio/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: pro-camera-studio-apk
          path: ProCameraStudio/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
